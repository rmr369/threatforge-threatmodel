# gitleaks configuration
#
# The test fixtures contain deliberately fake credentials -- that is the entire
# point of tests/fixtures/vulnerable/. Without this allowlist the pre-commit
# hook rejects every commit that touches them, and the usual reaction is to
# disable gitleaks entirely, which is far worse than scoping it.
#
# Scope is deliberately narrow: only the fixtures, and only files whose whole
# purpose is to be insecure. Everything else in the repo is still scanned.

title = "threatforge-threatmodel"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and generated reports"
paths = [
    '''tests/fixtures/.*''',
    '''example-report/.*''',
    '''threatforge-out/.*''',
    '''docs/WRITING-RULES\.md''',
    '''README\.md''',
]
regexes = [
    # placeholder values used in rule remediation snippets
    '''(?i)(changeme|placeholder|example\.com|sha256:0f6a1c2b3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8)''',
]
