name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full range of PR commits, not just the tip.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit must carry a Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0

          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "ok   $(echo "$sha" | cut -c1-8)  $subject"
            else
              echo "MISS $(echo "$sha" | cut -c1-8)  $subject  ($author)"
              missing=1
            fi
          done < <(git rev-list "$base..$head")

          if [ "$missing" -ne 0 ]; then
            cat <<'MSG'

          ------------------------------------------------------------------
          One or more commits are missing a Developer Certificate of Origin
          sign-off. See the DCO file in the repository root for what you are
          certifying.

          Fix the most recent commit:
              git commit --amend -s --no-edit
              git push --force-with-lease

          Fix every commit in this branch:
              git rebase --signoff origin/main
              git push --force-with-lease

          Sign off automatically in future:
              git config --global format.signOff true
          ------------------------------------------------------------------
          MSG
            exit 1
          fi

          echo "All commits signed off."
