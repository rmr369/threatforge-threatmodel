# .github/workflows/secret-scan.yml
name: Secret Scanning (Gitleaks + TruffleHog + GitGuardian)

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 3 * * *'          # Nightly full-history sweep
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Force full git-history scan'
        type: boolean
        default: true
      fail_on_findings:
        description: 'Fail the job when verified secrets are found'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write          # SARIF upload to Code Scanning
  pull-requests: write            # PR comment (GitGuardian)

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. GITLEAKS
  # ────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.count.outputs.findings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — mandatory for git-log scanning

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VER="8.28.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p reports
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path reports/gitleaks.sarif \
            ${GITLEAKS_CONFIG:+--config "$GITLEAKS_CONFIG"}
          echo "exit=$?" >> "$GITHUB_OUTPUT"
        env:
          GITLEAKS_CONFIG: ${{ hashFiles('.gitleaks.toml') != '' && '.gitleaks.toml' || '' }}

      - name: Also emit JSON (for the summary table)
        continue-on-error: true
        run: |
          gitleaks detect --source . --redact --no-banner --exit-code 0 \
            --report-format json --report-path reports/gitleaks.json || true

      - name: Count findings
        id: count
        run: |
          N=$(jq 'length' reports/gitleaks.json 2>/dev/null || echo 0)
          echo "findings=$N" >> "$GITHUB_OUTPUT"
          {
            echo "## Gitleaks — ${N} finding(s)"
            if [ "$N" -gt 0 ]; then
              echo "| Rule | File | Line | Commit | Author |"
              echo "|---|---|---|---|---|"
              jq -r '.[:50][] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | \(.Commit[0:8]) | \(.Author) |"' \
                 reports/gitleaks.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('reports/gitleaks.sarif') != ''
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # 2. TRUFFLEHOG  (verification = live credential check)
  # ────────────────────────────────────────────────────────────────
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verified: ${{ steps.count.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Scan repository (full history)
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p reports
          trufflehog git "file://$(pwd)" \
            --results=verified,unknown \
            --json \
            --no-update \
            --fail > reports/trufflehog.jsonl 2>reports/trufflehog.log || true
          wc -l reports/trufflehog.jsonl

      - name: Scan filesystem (catches untracked/binary artifacts)
        continue-on-error: true
        run: |
          trufflehog filesystem . \
            --results=verified,unknown --json --no-update \
            >> reports/trufflehog.jsonl 2>>reports/trufflehog.log || true

      - name: Summarize
        id: count
        run: |
          set -uo pipefail
          V=$(jq -s '[.[]|select(.Verified==true)]|length' reports/trufflehog.jsonl 2>/dev/null || echo 0)
          U=$(jq -s '[.[]|select(.Verified!=true)]|length' reports/trufflehog.jsonl 2>/dev/null || echo 0)
          echo "verified=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## TruffleHog — ${V} verified / ${U} unverified"
            if [ "$V" -gt 0 ]; then
              echo "| Detector | File | Commit | Link |"
              echo "|---|---|---|---|"
              jq -rs '[.[]|select(.Verified==true)][:50][] |
                "| \(.DetectorName) | `\(.SourceMetadata.Data.Git.file // "n/a")` | \((.SourceMetadata.Data.Git.commit // "n/a")[0:8]) | \(.SourceMetadata.Data.Git.link // "n/a") |"' \
                reports/trufflehog.jsonl
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-report
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # 3. GITGUARDIAN (ggshield)
  # ────────────────────────────────────────────────────────────────
  gitguardian:
    name: GitGuardian
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — API key present?
        id: guard
        run: |
          if [ -z "${{ secrets.GITGUARDIAN_API_KEY }}" ]; then
            echo "::warning::GITGUARDIAN_API_KEY not set — skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Incremental scan on push / PR
      - name: ggshield CI scan
        if: steps.guard.outputs.ok == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: GitGuardian/ggshield-action@v1
        with:
          args: -v --ignore-known-secrets
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA:   ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA:   ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH:  ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY:    ${{ secrets.GITGUARDIAN_API_KEY }}

      # Full-history sweep on schedule / manual — CLI, no action dependency
      - name: ggshield full-history scan
        if: steps.guard.outputs.ok == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p reports
          pip install --quiet --upgrade ggshield
          ggshield --version
          ggshield secret scan --json repo . > reports/ggshield.json 2>reports/ggshield.log || true
          ggshield secret scan repo . || true
          jq -r '.total_incidents // 0' reports/ggshield.json 2>/dev/null \
            | xargs -I{} echo "## GitGuardian — {} incident(s)" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('reports/*') != ''
        with:
          name: gitguardian-report
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # 4. AGGREGATE GATE
  # ────────────────────────────────────────────────────────────────
  gate:
    name: Secret Scan Gate
    needs: [gitleaks, trufflehog, gitguardian]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          set -euo pipefail
          GL="${{ needs.gitleaks.outputs.count || 0 }}"
          TH="${{ needs.trufflehog.outputs.verified || 0 }}"
          FAIL="${{ github.event.inputs.fail_on_findings || 'true' }}"

          {
            echo "## Combined result"
            echo "| Scanner | Findings |"
            echo "|---|---|"
            echo "| Gitleaks | ${GL} |"
            echo "| TruffleHog (verified) | ${TH} |"
            echo "| GitGuardian | see job log / artifact |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" = "true" ] && { [ "$GL" -gt 0 ] || [ "$TH" -gt 0 ]; }; then
            echo "::error::Secrets detected. Rotate the credential FIRST, then purge from history."
            exit 1
          fi
          echo "No blocking findings."
