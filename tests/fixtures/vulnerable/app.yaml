apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
  labels: {app: storefront}
spec:
  replicas: 1
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: web
          image: shop/storefront:latest
          ports:
            - containerPort: 8080
              hostPort: 8080
          env:
            - name: DB_PASSWORD
              value: "sup3rS3cretP@ssw0rd!"
            - name: STRIPE_API_KEY
              value: "sk_live_51H8xYzAbCdEf"
            - name: LOG_LEVEL
              value: debug
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: dockersock
              mountPath: /var/run/docker.sock
        - name: sidecar-agent
          image: vendor/agent
          securityContext:
            capabilities:
              add: ["SYS_ADMIN", "NET_RAW"]
      volumes:
        - name: dockersock
          hostPath: {path: /var/run/docker.sock}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: shop
spec:
  type: LoadBalancer
  selector: {app: storefront}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront-ingress
  namespace: shop
spec:
  rules:
    - host: "*.shop.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port: {number: 80}
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db
  namespace: shop
type: Opaque
data:
  password: c3VwM3JTM2NyZXRQQHNzdzByZCE=
  username: YWRtaW4=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  API_TOKEN: "ghp_A1b2C3d4E5f6G7h8I9j0"
  LOG_LEVEL: "debug"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop
  labels: {app: postgres}
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      serviceAccountName: postgres-sa
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: shop-db, key: password}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
spec:
  type: NodePort
  selector: {app: postgres}
  ports:
    - port: 5432
      nodePort: 30432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: shop
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shop-operator
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shop-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shop-operator
subjects:
  - kind: ServiceAccount
    name: postgres-sa
    namespace: shop
