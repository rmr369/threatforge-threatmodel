# GitLab CI equivalent of .github/workflows/threat-model.yml
threat-model:
  image: python:3.12-slim
  stage: test
  script:
    - pip install --quiet ".[all]"
    - threatforge scan . --out threatforge-out -f json -f html -f sarif -f markdown
    - threatforge gate .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - threatforge-out/
    reports:
      # GitLab Ultimate consumes SAST-format reports; SARIF is kept as an artifact
      # for other consumers.
      sast: threatforge-out/threatforge.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
